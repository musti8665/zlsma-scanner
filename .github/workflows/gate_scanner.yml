name: 🧪 Gate.io TestNet Scanner (DEMO — NO REAL MONEY)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-testnet-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install gate-api pandas numpy requests

      - name: 🛡️ Assert TestNet
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "🧪 ENVIRONMENT: GATE.IO TESTNET (DEMO)"
          echo "🧪 VIRTUAL FUNDS ONLY — NO REAL MONEY"
          echo "═══════════════════════════════════════════════════"

      - name: Verify files
        run: |
          ls -la
          test -f gate_scanner.py || (echo "❌ gate_scanner.py missing" && exit 1)
          test -f requirements.txt || (echo "❌ requirements.txt missing" && exit 1)
          test -f state.json || (echo "❌ state.json missing" && exit 1)
          echo "✅ All files present"

      - name: Run scanner
        env:
          PYTHONUNBUFFERED: 1
        run: python gate_scanner.py

      # ✅ این بخش بسیار مهم است: ذخیره حافظه (state) و لاگ‌ها بعد از هر اجرا
      - name: Commit state and logs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🧪 chore(testnet): update state and logs [skip ci]"
          file_pattern: "state.json gate_scanner_log.jsonl"
