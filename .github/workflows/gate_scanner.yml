name: 🧪 Gate.io TestNet Scanner (DEMO — NO REAL MONEY)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-testnet-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install gate-api pandas numpy requests

      - name: 🛡️ Assert TestNet
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "🧪 ENVIRONMENT: GATE.IO TESTNET (DEMO)"
          echo "🧪 VIRTUAL FUNDS ONLY — NO REAL MONEY"
          echo "═══════════════════════════════════════════════════"

      - name: Run scanner
        env:
          PYTHONUNBUFFERED: 1
        run: python gate_scanner.py
