name: Alpaca Trading Bot (30m)

on:
  schedule:
    # اجرای خودکار هر ۳۰ دقیقه یک بار
    - cron: '*/30 * * * *'
  workflow_dispatch: # اجازه اجرای دستی برای تست

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas numpy

      - name: Run scanner
        env:
          PYTHONUNBUFFERED: 1
        run: python acmts_scanner.py

      - name: Commit and save logs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update bot logs [skip ci]"
          file_pattern: "*.json *.csv"
