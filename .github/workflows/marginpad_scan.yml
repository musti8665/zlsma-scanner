    steps:
      - name: Checkout repo
        uses: actions/checkout@v5   # ← از v4 به v5 ارتقا یافت

      - name: Setup Python
        uses: actions/setup-python@v6   # ← از v5 به v6 ارتقا یافت
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy python-binance

      - name: Run scanner
        env:
          PYTHONUNBUFFERED: 1
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python acmts_scanner.py

      - name: Commit and save logs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7   # ← از v5 به v7 ارتقا یافت
        with:
          commit_message: "chore: auto-update bot logs [skip ci]"
          file_pattern: "*.json *.csv *.log"
