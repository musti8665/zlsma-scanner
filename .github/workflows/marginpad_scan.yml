name: Binance Demo Futures Scanner (30m)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify best_configs.json
        run: |
          if [ ! -f best_configs.json ]; then
            echo "❌ best_configs.json not found in repo!"
            exit 1
          fi
          echo "✅ best_configs.json found"
          python -c "import json; d=json.load(open('best_configs.json')); print(f\"Configs: {len(d.get('configs', []))}\")"

      - name: Run scanner
        env:
          PYTHONUNBUFFERED: 1
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python acmts_scanner.py

      - name: Commit and save logs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update bot logs [skip ci]"
          file_pattern: "*.json *.csv *.log"
