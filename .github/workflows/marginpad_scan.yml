name: Binance Testnet Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas numpy ccxt

      - name: Run scanner
        env:
          # اینجا فقط تلگرام رو ست می‌کنیم چون کلیدهای بایننس مستقیم تو کد هستن
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT }}
        run: python acmts_scanner.py

      - name: Commit and save trade logs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update trade log [skip ci]"
          file_pattern: "binance_trades_log.json"
