name: MarginPad ACMTS Scanner

on:
  schedule:
    # هر ۱۵ دقیقه اجرا می‌شود. اگر ۳۰ دقیقه می‌خواهی، بنویس: '*/30 * * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch: # اجازه میده دستی هم اجرا کنی

permissions:
  contents: write # این خط برای ذخیره فایل لاگ (Commit) ضروری است

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas numpy

      - name: Run scanner
        env:
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT }}
          DAILY_PAPER_MODE: "true"     # فعلا روی پیپر (مجازی) باشه
          INTERVAL_MIN: "0"            # 👈 این خط خیلی مهمه! میگه فقط یک بار اجرا کن و نخواب
        run: python acmts_scanner.py

      - name: Commit and save trade logs
        if: always() # حتی اگر ربات ارور داد، لاگ‌ها رو ذخیره کن
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update trade log [skip ci]"
          file_pattern: "marginpad_trades_log.csv"
